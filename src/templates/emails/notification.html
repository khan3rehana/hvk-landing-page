<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f7fb; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #10213d;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f4f7fb; padding: 32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width: 600px; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(10, 36, 82, 0.08);">
          <!-- Header -->
          <tr>
            <td style="background-color: #0a2452; padding: 28px 32px; text-align: center;">
              <h1 style="color: #ffffff; margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.5px;">{{title}}</h1>
            </td>
          </tr>
          <!-- Content -->
          <tr>
            <td style="padding: 32px; border: 1px solid #e2e8f0; border-top: none; border-radius: 0 0 12px 12px;">
              {{#if greeting}}
              <p style="font-size: 16px; margin: 0 0 16px; color: #10213d;">{{greeting}}</p>
              {{/if}}

              <div style="font-size: 15px; line-height: 1.6; color: #334155; margin: 0 0 24px;">
                {{message}}
              </div>

              {{#if buttonUrl}}
              <div style="text-align: center; margin: 28px 0;">
                <a href="{{buttonUrl}}" style="display: inline-block; background-color: #2563eb; color: #ffffff; text-decoration: none; padding: 12px 28px; border-radius: 8px; font-weight: 700; font-size: 15px;">
                  {{buttonText}}
                </a>
              </div>
              {{/if}}

              {{#if footerText}}
              <p style="font-size: 13px; line-height: 1.5; margin: 24px 0 0; color: #64748b; border-top: 1px solid #e2e8f0; padding-top: 16px;">
                {{footerText}}
              </p>
              {{/if}}

              <p style="margin: 24px 0 0; color: #64748b; font-size: 14px; font-weight: 600;">
                — Team HVK
              </p>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding: 20px 32px; text-align: center; font-size: 12px; color: #94a3b8;">
              © {{year}} HVK. All rights reserved.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
